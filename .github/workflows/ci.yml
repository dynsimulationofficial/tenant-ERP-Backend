name: Deploy compresscrm-backend-staging

on:
  push:
    branches:
      - master

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-backend-staging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-scan:
    name: Code & Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Security Audit
        run: npm audit --audit-level=high || true

      - name: Run ESLint
        run: npm run lint || true

  build-and-push:
    name: Build & Push Docker Image
    needs: code-scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Debug GitHub Context
        run: |
          echo "Actor: ${{ github.actor }}"
          echo "Repository: ${{ github.repository }}"
          echo "Image Tag: ${{ github.sha }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: dynsimulationofficial
          password: ${{ secrets.GHCR_PAT }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          no-cache: true
          tags: |
            ghcr.io/dynsimulationofficial/tenant-erp-backend:latest
            ghcr.io/dynsimulationofficial/tenant-erp-backend:${{ github.sha }}

  deploy:
    name: Deploy to Staging Server
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /root/compresscrmbackend
            
            # Sync the latest deployment scripts and docker-compose files to the server
            git pull origin master || true
            
            # Authenticate Docker with GHCR before pulling
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u danishkkhan13 --password-stdin
            
            chmod +x scripts/deploy.sh
            SERVER_GITHUB_TOKEN="${{ secrets.GHCR_PAT }}" ./scripts/deploy.sh "${{ github.sha }}"